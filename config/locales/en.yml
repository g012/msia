    "about": {
      "eyebrow": "THE MSIA PROJECT",
      "title": "Bringing two tables closer.",
      "intro": "From a Malaysian kopitiam to a kitchen in France, there are thousands of kilometres. We’re exploring a simple idea: make hard-to-find Malaysian specialities more accessible in Europe.",
      "heading": "A collection in the making.",
      "body": "MSIA is a research-stage project, not an established importer. We’re first exploring Hock Kee Kopitiam’s products and potential customers’ preferences. We do not claim an official partnership with the manufacturer.",
      "second_heading": "Moving forward, transparently.",
      "second_body": "Before any sales, we need to confirm suppliers, ingredients, import requirements, labelling, prices and logistics. Joining the waitlist expresses interest. It is neither an order nor a promise of delivery.",
      "link": "Visit Hock Kee’s official website"
    },
    "faq": {
      "title": "Straightforward answers.",
      "intro": "It’s early days. Here’s what we can tell you today.",
      "items": [
        {
          "q": "When will products be available?",
          "a": "No date has been announced. We are researching demand, suppliers and import conditions. The waitlist will hear if the project moves towards launch."
        },
        {
          "q": "Where will you ship?",
          "a": "We aim to start in France, with other EU countries a possible later step. No delivery area has been confirmed yet."
        },
        {
          "q": "Will products be EU compliant?",
          "a": "Each product must be checked before any sale: composition, labelling, allergens, traceability and import requirements. No product in this initial collection is presented as approved for import."
        },
        {
          "q": "Are the products halal?",
          "a": "We do not assign a blanket certification to this collection. Product-specific status, certifying body, scope and document validity still need verification."
        },
        {
          "q": "What about allergens?",
          "a": "Complete lists are not available for all references. A vegetarian label does not mean allergen-free. Do not rely on these discovery pages to decide whether a product is safe for an allergy."
        },
        {
          "q": "Why a waitlist?",
          "a": "Signups and favourites help us measure real interest, prioritise products and study a coherent first import. Joining is free and carries no obligation."
        },
        {
          "q": "Will prices be similar to Malaysia?",
          "a": "We have not set prices. Transport, taxes, checks, labelling and distribution can affect the final cost. We do not promise Malaysian retail prices."
        }
      ]
    },
